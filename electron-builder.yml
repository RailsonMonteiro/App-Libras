appId: org.louvorja.libras
productName: APP Libras
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
asar: true
# The PowerPoint PowerShell scripts (electron/services/powerpoint) need a real file path a fresh
# `powershell.exe -File` can load - it cannot reach inside app.asar - so they ship unpacked.
extraResources:
  - from: electron/services/powerpoint/scripts
    to: powershell
# Electron-builder's default template ("${productName} Setup ${version}.${ext}") has spaces -
# the v1.4.0 release ended up with a renamed installer that no longer matched the "latest.yml"
# electron-builder generated for it (dashes), breaking auto-update's download step. One fixed,
# dotted pattern for every artifact (the installer, its blockmap, "latest*.yml" stay in sync
# with each other because they are all named from this same template at build time). The app's
# display name changed from "LouvorJA Libras" to "APP Libras" (2026-10-21); this pattern follows.
artifactName: APP.Libras.${version}.${ext}
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: [dmg]
  category: public.app-category.education
linux:
  target: [AppImage, deb]
  category: Education
# Distribution is free: no code signing or licensing server is configured. Updates check GitHub
# Releases on this repo (electron-updater reads the "latest*.yml" electron-builder publishes
# alongside each release's installer) - see UpdaterService (electron/services). Auto-update only
# really works end to end for the win/nsis and linux/AppImage targets below; mac/dmg alone (no
# "zip" target, no code signing) cannot self-update, only check.
publish:
  provider: github
  owner: RailsonMonteiro
  repo: LouvorJA-Libras
